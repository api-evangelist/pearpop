aid: pearpop
name: PearPop
description: 'Pearpop, Inc. is a Los Angeles-based creator marketing company founded
  in October 2020 by Cole Mason and Guy Oseary. It began as a two-sided social collaboration
  marketplace where brands could book social-media creators on demand under a performance-based,
  pay-per-placement model, and has since grown into a full-service creator marketing
  partner running campaigns for brands including Netflix, Microsoft, Chipotle, Klarna
  and Activision. Its current product line is marketed at pearpop.com (brand campaigns,
  creator representation and events) plus Pearpop.AI at pearpop.ai — described in
  Pearpop''s own terms of service as an AI-powered email platform for content creators
  and influencers that handles brand-deal inboxes, contract review, rate recommendations
  and payments. Pearpop publishes no public developer program, API documentation,
  SDKs or machine-readable API specification; the only live API namespace, pearpop.ai/api/*,
  redirects unauthenticated callers to the application sign-in page.'
